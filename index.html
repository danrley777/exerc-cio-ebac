<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Números</title>
    <style>
        body {
            margin: 2em;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card label {
            font-size: larger;
            font-weight: 600;
        }

        .card input {
            height: 30px;
            width: 500px;
            border: 2px rgb(41, 41, 68) solid ;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: larger;
        }

        button {
            text-align: center;
            border: none;
            background-color: rgb(41, 41, 68);
            padding: 20px;
            border-radius: 10px;
            width: 520px;
            color: white;
            font-size: large;
        }

        p {
            font-size: large;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Maior numero</h1>
        <div class="card">
            <label for="">valor de A</label>
            <input id="A" placeholder="Digite o valor de A" type="number">
        </div>
        <div class="card">
            <label for="">valor de B</label>
            <input id="B" placeholder="Digite o valor de B" type="number">
        </div>
        <button onclick="verificaMaior()">conferir</button>
        <p id="resultado"></p>
    </div>

    <script>
        function verificaMaior() {
            const numA = document.getElementById("A").value
            const numB = document.getElementById("B").value

            if(numB > numA) {
                document.getElementById("resultado").textContent = `B (${numB}) é maior que A (${numA}). Parabéns!`
            } else {
                document.getElementById("resultado").textContent = `B (${numB}) não é maior que A (${numA}). Tente novamente`
            }
        }
    </script>
</body>
</html>
